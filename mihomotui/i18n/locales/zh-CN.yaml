system_proxy.session_hint: |
  已写入 ~/.bashrc、~/.zshrc、~/.profile，并同步到当前桌面会话。

  • 本终端及其他已打开的终端：执行 source ~/.bashrc（或 source ~/.zshrc）
  • 新打开的终端 / 桌面应用：自动生效
system_proxy.clear_hint: |
  已删除 shell 配置文件中的代理块，并清理当前进程与用户会话变量。

  已打开的终端仍持有旧变量（Unix 限制：进程无法修改其他已运行 shell 的环境），
  请在其中执行：
    unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy

  或直接重开终端（no_proxy 建议保留，本机回环不走代理）。
