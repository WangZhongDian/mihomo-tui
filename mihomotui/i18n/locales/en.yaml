system_proxy.session_hint: |
  Written to ~/.bashrc, ~/.zshrc, and ~/.profile, and synchronized with the current desktop session.

  • This terminal and other open terminals: run source ~/.bashrc (or source ~/.zshrc)
  • New terminals / desktop applications: applied automatically
system_proxy.clear_hint: |
  Removed proxy blocks from shell configuration files and cleared current process and user-session variables.

  Open terminals still hold the old variables (Unix does not allow a process to modify another running shell's environment).
  Run this in each terminal:
    unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy

  Or open a new terminal (keeping no_proxy is recommended so local traffic bypasses the proxy).
